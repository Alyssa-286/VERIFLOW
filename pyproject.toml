[project]
name = "veriflow"
version = "0.1.0"
description = "VERIFLOW: Verifier Error Heterogeneity and Learning Dynamics"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100"]
# GPU environment for Phase 4 (cluster census) — master plan §16.5.
# TRL is pinned for Phase 5 (D17). vLLM is not used: NVML is broken on sit-gpu and HF generate is the backend.
# torch floor satisfies TRL 1.17.x's requirement (torch>=2.6);
# transformers floor likewise (>=4.56.2). Exact versions are frozen by `uv lock`.
# Sync on the cluster with: uv sync --group gpu --frozen
gpu = [
    "torch>=2.6,<2.9",
    "transformers>=4.56.2,<5",
    "accelerate>=1.11",
    "huggingface-hub>=0.34",
    "trl==1.17.1",           # Phase 5 (D17): exact pin; GRPOConfig values pinned in configs/base.json
    "datasets>=4.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
